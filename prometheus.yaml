apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  annotations:
    meta.helm.sh/release-name: px-central
    meta.helm.sh/release-namespace: px-backup
  creationTimestamp: "2026-01-06T07:36:17Z"
  generation: 1
  labels:
    app.kubernetes.io/managed-by: Helm
  name: px-backup-dashboard-prometheus
  namespace: px-backup
  resourceVersion: "26815545"
  uid: 5670ad2c-588b-4ab4-9075-f6e61681b112
spec:
  additionalAlertManagerConfigs:
    key: am-configs.yaml
    name: pxc-backup-metrics
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: pxbackup/enabled
            operator: NotIn
            values:
            - "false"
  containers:
  - args:
    - --web.console.templates=/etc/prometheus/consoles
    - --web.console.libraries=/etc/prometheus/console_libraries
    - --storage.tsdb.retention.time=90d
    - --storage.tsdb.retention.size=51200MB
    - --config.file=/etc/prometheus/config_out/prometheus.env.yaml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    - --web.route-prefix=/
    - --log.level=debug
    - --web.config.file=/etc/prometheus/web_config/web-config-custom.yaml
    env:
    - name: AUTH_SECRET
      valueFrom:
        secretKeyRef:
          key: metrics-token
          name: pxc-backup-metrics
    - name: SERVICE_MESH
      value: ""
    image: pure-artifactory.dev.purestorage.com/px-docker-remote/portworx/prometheus:v3.6.0
    livenessProbe:
      exec:
        command:
        - sh
        - -c
        - wget  http://localhost:9090/-/healthy --header="Authorization:Basic $AUTH_SECRET"
          -qO-
    name: prometheus
    ports:
    - containerPort: 9090
      name: http-web
      protocol: TCP
    readinessProbe:
      exec:
        command:
        - sh
        - -c
        - wget  http://localhost:9090/-/ready --header="Authorization:Basic $AUTH_SECRET"
          -qO-
    startupProbe:
      exec:
        command:
        - sh
        - -c
        - wget  http://localhost:9090/-/ready --header="Authorization:Basic $AUTH_SECRET"
          -qO-
  - args:
    - --listen-address=:8080
    - --reload-url=http://$(USERNAME):$(PASSWORD)@localhost:9090/-/reload
    - --config-file=/etc/prometheus/config/prometheus.yaml.gz
    - --config-envsubst-file=/etc/prometheus/config_out/prometheus.env.yaml
    - --watched-dir=/etc/prometheus/rules/prometheus-px-backup-dashboard-prometheus-rulefiles-0
    - --log-level=debug
    env:
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: pxc-backup-metrics
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: pxc-backup-metrics
    name: config-reloader
    ports:
    - containerPort: 8080
      name: reloader-web
      protocol: TCP
  evaluationInterval: 30s
  initContainers:
  - name: init-config-reloader
  listenLocal: true
  logLevel: debug
  portName: web
  replicas: 2
  ruleSelector:
    matchLabels:
      app: px-backup-alerts
  scrapeInterval: 30s
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
  serviceAccountName: px-backup-dashboard-prometheus
  serviceMonitorSelector:
    matchLabels:
      name: px-backup-dashboard-prometheus-sm
  storage:
    volumeClaimTemplate:
      spec:
        resources:
          requests:
            storage: 64Gi
        storageClassName: px-csi-db